name: Build Crb Launcher APK (com.crb.tv)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Crb Launcher Release & Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Project Structure & Setup Gradle 8.5
        run: |
          set -e
          # 1. Ekstrak otomatis file .zip apa pun (misal CrbLauncher.zip atau CrbLauncher (1).zip) yang diupload ke repo GitHub
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Extracting uploaded archive: $z"
              unzip -q -o "$z"
            fi
          done

          # 2. Cari folder tempat app/src/main/AndroidManifest.xml berada
          MANIFEST_PATH=$(find . -path "*/src/main/AndroidManifest.xml" | head -n 1)
          if [ -z "$MANIFEST_PATH" ]; then
            echo "=================================================================="
            echo "ERROR: File kode proyek (AndroidManifest.xml) belum ditemukan di repositori GitHub Anda!"
            echo "SOLUSI MUDAH DARI HP:"
            echo "1. Buka halaman utama repositori GitHub Anda."
            echo "2. Klik tombol '+' / 'Add file' -> 'Upload files'."
            echo "3. Pilih file CrbLauncher.zip dari HP Anda lalu klik 'Commit changes'."
            echo "=================================================================="
            ls -la
            exit 1
          fi

          APP_DIR=$(dirname "$(dirname "$(dirname "$MANIFEST_PATH")")")
          BUILD_DIR=$(dirname "$APP_DIR")
          echo "Detected BUILD_DIR=$BUILD_DIR and APP_DIR=$APP_DIR"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

          # 3. Pastikan Android SDK Platform 34 tersedia menggunakan sdkmanager bawaan Ubuntu runner
          SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
            "$SDK_MGR" "platforms;android-34" "build-tools;34.0.0"
          fi

          # 4. Pasang Gradle 8.5 yang 100% kompatibel dengan AGP 8.2.2 & JDK 17 di GitHub Actions
          if [ ! -d "/tmp/gradle-8.5" ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle-8.5-bin.zip
            unzip -q -o /tmp/gradle-8.5-bin.zip -d /tmp
          fi
          echo "/tmp/gradle-8.5/bin" >> "$GITHUB_PATH"

          # 5. Normalisasi build.gradle & settings.gradle di BUILD_DIR agar cocok dengan Gradle 8.5
          cat << 'EOF_ROOT_BG' > "$BUILD_DIR/build.gradle"
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF_ROOT_BG

          cat << 'EOF_SETTINGS' > "$BUILD_DIR/settings.gradle"
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CrbLauncher"
          include ':app'
          EOF_SETTINGS

          cat << 'EOF_PROPS' > "$BUILD_DIR/gradle.properties"
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_PROPS

      - name: Compile Crb Launcher Debug & Release APK
        run: |
          set -e
          cd "$BUILD_DIR"
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Collect & Rename APK Files
        run: |
          set -e
          mkdir -p output-apk
          DEBUG_APK=$(find "$BUILD_DIR/app/build/outputs/apk" -name "*debug*.apk" | head -n 1)
          RELEASE_APK=$(find "$BUILD_DIR/app/build/outputs/apk" -name "*release*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" output-apk/CrbLauncher-com.crb.tv-debug.apk
          fi
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" output-apk/CrbLauncher-com.crb.tv-release.apk
          fi
          ls -lh output-apk/

      - name: Upload Crb Launcher APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrbLauncher-com.crb.tv-APK
          path: output-apk/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.6-latest
          name: "Crb Launcher (com.crb.tv) - Latest APK Build"
          body: |
            Build otomatis **Crb Launcher (`com.crb.tv`)** untuk Android TV / Smart TV:
            - Jadwal Sholat Kota Cirebon (Kemenag RI) + Suara Adzan Muadzin Otomatis
            - Cuaca Real-Time Wilayah Karya Mulya, Kota Cirebon
            - Jadwal & Skor Sepak Bola Real dari LiveScore.mobi (Live, Hasil FT & Jadwal)
            - Menu Grid App Favorit di Kiri Bawah Jam & Dialog Kaca Transparan
            - Ganti Background & Rolling Background (`.jpg`, `.png`, `.gif`, `.mp4`) via Wi-Fi HP
            - Running Text 60fps (Edit di Setting), Screen Saver, & Auto-Start saat Power On
          files: output-apk/*.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

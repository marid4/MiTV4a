name: Build Crb Launcher APK (com.crb.tv)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Crb Launcher Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (Platform 34)
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Build Tools 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 7.5.1 (Compatible with AGP 7.3.1 & AndroidIDE)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'

      - name: Compile Crb Launcher Debug & Release APK
        run: |
          if [ -f "settings.gradle" ]; then
            BUILD_DIR="."
          elif [ -f "CrbLauncher/settings.gradle" ]; then
            BUILD_DIR="CrbLauncher"
          elif [ -f "launcher/settings.gradle" ]; then
            BUILD_DIR="launcher"
          else
            BUILD_DIR="."
          fi
          echo "Building Crb Launcher in directory: $BUILD_DIR"
          cd "$BUILD_DIR"
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Collect & Rename APK Files
        run: |
          mkdir -p output-apk
          DEBUG_APK=$(find . -path "*/outputs/apk/debug/*.apk" | head -n 1)
          RELEASE_APK=$(find . -path "*/outputs/apk/release/*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" output-apk/CrbLauncher-com.crb.tv-debug.apk
          fi
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" output-apk/CrbLauncher-com.crb.tv-release.apk
          fi
          ls -lh output-apk/

      - name: Upload Crb Launcher APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrbLauncher-com.crb.tv-APK
          path: output-apk/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to GitHub Releases (Automatic Latest Release)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.6-latest
          name: "Crb Launcher (com.crb.tv) - Latest APK Build"
          body: |
            Build otomatis **Crb Launcher (`com.crb.tv`)** untuk Android TV / Smart TV:
            - Jadwal Sholat Kota Cirebon (Kemenag RI) + Suara Adzan Muadzin Otomatis
            - Cuaca Real-Time Wilayah Karya Mulya, Kota Cirebon
            - Jadwal & Skor Sepak Bola Real dari LiveScore.mobi (Live, Hasil FT & Jadwal)
            - Menu Grid App Favorit di Kiri Bawah Jam & Dialog Kaca Transparan
            - Ganti Background & Rolling Background (`.jpg`, `.png`, `.gif`, `.mp4`) via Wi-Fi HP
            - Running Text 60fps (Edit di Setting), Screen Saver, & Auto-Start saat Power On
          files: output-apk/*.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
